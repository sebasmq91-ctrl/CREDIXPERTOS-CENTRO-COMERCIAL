<svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Fondo si es necesario -->
  <defs>
    <style>
      .logo-text-main { font-family: 'Montserrat', Arial, sans-serif; font-size: 48px; font-weight: 700; }
      .logo-text-credi { fill: #00B4C8; }
      .logo-text-xpertos { fill: #0A2540; }
      .logo-tagline { font-family: 'DM Sans', Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #0A2540; letter-spacing: 0.5px; }
    </style>
  </defs>
  
  <!-- Círculo C (marco) -->
  <circle cx="50" cy="60" r="42" fill="none" stroke="#00B4C8" stroke-width="12" stroke-linecap="round" stroke-dasharray="250 314" transform="rotate(-45 50 60)"/>
  
  <!-- Flecha dentro del C -->
  <g transform="translate(50, 60)">
    <!-- Línea de la flecha -->
    <line x1="-15" y1="0" x2="20" y2="0" stroke="#00B4C8" stroke-width="3" stroke-linecap="round"/>
    <!-- Punta de la flecha arriba-derecha -->
    <polygon points="20,0 15,8 8,3" fill="#00B4C8"/>
  </g>
  
  <!-- Texto "Credixpertos" -->
  <text x="110" y="85" class="logo-text-main">
    <tspan class="logo-text-credi">Credi</tspan><tspan class="logo-text-xpertos">xpertos</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="110" y="112" class="logo-tagline">más que un crédito, una solución</text>
</svg>
